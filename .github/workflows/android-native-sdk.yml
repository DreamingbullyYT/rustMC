name: Android native HMOD SDK

# Runs after a successful Android APK build. The APK workflow publishes the rolling
# "nightly" release itself, so workflow_run is the reliable trigger for Nightly builds
# created with GITHUB_TOKEN. Version tags (v*) use the same path.
#
# This workflow is deliberately fail-closed: it will not publish desktop SDK slices
# under an Android target name. The Android producer must exist and pass its own
# artifact/link smoke tests before the build job is enabled.
on:
  workflow_run:
    workflows: ["Android build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact rustMC commit to build the Android SDK against (defaults to this workflow's commit)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-native-sdk-${{ github.event.workflow_run.head_sha || inputs.source_commit || github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve exact Android build identity
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           (github.event.workflow_run.head_branch == github.event.repository.default_branch ||
            startsWith(github.event.workflow_run.head_branch, 'v'))) }}
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      producer_ready: ${{ steps.identity.outputs.producer_ready }}
    steps:
      - name: Check out the exact source used by the APK build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_commit || github.sha }}
          persist-credentials: false

      - name: Resolve immutable source and producer status
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full 40-character rustMC commit, got: $source_commit"
            exit 1
          fi
          upstream_commit="$(tr -d '[:space:]' < android/UPSTREAM_PIN)"
          if [[ ! "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::android/UPSTREAM_PIN is not a full upstream commit: $upstream_commit"
            exit 1
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
          if [ -x android/ci/build-native-sdk.sh ]; then
            echo "producer_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "producer_ready=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Android native HMOD SDK"
            echo
            echo "- rustMC source: `$source_commit`"
            echo "- Horizon upstream pin: `$upstream_commit`"
            echo "- Android target: `aarch64-linux-android`"
            echo "- APK workflow: `${{ github.event.workflow_run.id || 'manual dispatch' }}`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report producer implementation gate
        if: steps.identity.outputs.producer_ready != 'true'
        run: |
          {
            echo "### SDK production is safely blocked"
            echo
            echo "The Android ARM64 SDK producer is not implemented yet. No SDK release was created."
            echo "This workflow will automatically use android/ci/build-native-sdk.sh once that script exists and is executable."
            echo "Desktop SDK artifacts are never relabelled as Android artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-publish:
    name: Build, verify and publish Android SDK
    needs: preflight
    if: needs.preflight.outputs.producer_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Build and verify the Android SDK
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          UPSTREAM_COMMIT: ${{ needs.preflight.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          # The producer owns NDK/Rust pinning, slice layout, reproducibility checks,
          # ELF/link smoke tests and signing. It must publish only after all gates pass.
          bash android/ci/build-native-sdk.sh "$SOURCE_COMMIT" "$UPSTREAM_COMMIT"
